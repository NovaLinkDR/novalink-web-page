services:
  novalink-web:
    build: .
    container_name: novalink-web
    restart: unless-stopped
    networks:
      - coolify
    depends_on:
      - novalink-api

  novalink-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: novalink-api
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - LEADS_FILE=/data/leads.json
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
    volumes:
      - novalink_data:/data

networks:
  coolify:
    external: true

volumes:
  novalink_data:
