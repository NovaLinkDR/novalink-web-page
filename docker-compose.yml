services:
  novalink-web:
    build: .
    container_name: novalink-web
    restart: unless-stopped
    networks:
      - coolify
    depends_on:
      - novalink-api

  novalink-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: novalink-api
    restart: unless-stopped
    networks:
      - coolify
    env_file:
      - .env
    environment:
      - LEADS_FILE=/data/leads.json
    volumes:
      - novalink_data:/data

networks:
  coolify:
    external: true

volumes:
  novalink_data:
